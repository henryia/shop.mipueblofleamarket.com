name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite deploy manual desde GitHub

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURAR ESTOS SECRETS EN GITHUB ANTES DEL PRIMER DEPLOY:
# (Settings → Secrets and variables → Actions → New repository secret)
#
# VPS_HOST         → IP del VPS Hostinger (ej: 156.67.xxx.xxx)
# VPS_USER         → usuario SSH (ej: deploy)
# VPS_SSH_KEY      → clave privada SSH (contenido del archivo id_rsa)
# VPS_PORT         → puerto SSH (default: 22)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Solo corre si CI pasó y es push a main
    needs: []
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 300s
          script: |
            set -e

            echo "🚀 Iniciando deploy..."

            cd /var/www/shop.mipueblofleamarket.com

            # Pull latest code
            git pull origin main

            # Install deps (solo las nuevas)
            pnpm install --frozen-lockfile

            # Generar Prisma client
            pnpm db:generate

            # Build
            pnpm build

            # Migrations en producción
            pnpm db:migrate

            # Restart con PM2
            pm2 reload ecosystem.config.js --update-env

            echo "✅ Deploy completado en $(date)"

  # 🧠 Claude Skill / Conector relevante aquí:
  # Cuando tengamos el VPS configurado, conectaremos Sentry para monitoreo.
  # Si instalamos el MCP de Sentry, yo podré ver errores de producción
  # directamente en el chat sin que abras el dashboard.
  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "❌ Deploy falló en $(date)"
          echo "Ver: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # TODO: enviar email o Slack con Resend cuando esté configurado
