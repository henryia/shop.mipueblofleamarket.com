# ─── Nginx config — shop.mipueblofleamarket.com ───────────────────────────
# Copiar a: /etc/nginx/sites-available/shop.mipueblofleamarket.com
# Activar:  ln -s /etc/nginx/sites-available/shop... /etc/nginx/sites-enabled/
# TLS:      certbot --nginx -d shop.mipueblofleamarket.com

server {
    listen 80;
    server_name shop.mipueblofleamarket.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.mipueblofleamarket.com;

    # TLS (certbot rellena estos paths automáticamente)
    ssl_certificate     /etc/letsencrypt/live/shop.mipueblofleamarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.mipueblofleamarket.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Seguridad
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # Logs
    access_log /var/log/nginx/shop_access.log;
    error_log  /var/log/nginx/shop_error.log;

    # Archivos estáticos de Next.js — cache agresivo
    location /_next/static/ {
        alias /var/www/shop.mipueblofleamarket.com/apps/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts generosos para rutas de checkout/pago
        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # Upload de archivos grandes (video hasta 100MB)
    client_max_body_size 110M;
}
